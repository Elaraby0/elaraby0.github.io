baseURL: "https://elaraby.me/"
title: "Ahmed Elaraby"
theme: "PaperMod"
pagerSize: 10
enableRobotsTXT: true

# Multilingual
defaultContentLanguage: en
defaultContentLanguageInSubdir: true  # site served at /en/ and /ar/

# Build outputs (section RSS enabled)
outputs:
  home:    [HTML, RSS]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML]

# RSS service (optional limit)
services:
  rss:
    limit: 50

# Taxonomies (optional)
taxonomies:
  category: categories
  tag: tags

# Pretty permalinks for blog posts
permalinks:
  blog: "/blog/:slug/"

# Allow HTML inside Markdown (for CV button etc.)
markup:
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  displayFullLangName: true

  # Profile Mode enabled globally; per-language titles/buttons below
  profileMode:
    enabled: true

  # FAVICONS (absolute paths + cache-busting)
  assets:
    favicon: "/favicon.ico?v=3"
    favicon16x16: "/favicon-16x16.png?v=3"
    favicon32x32: "/favicon-32x32.png?v=3"
    apple_touch_icon: "/apple-touch-icon.png?v=3"

  # Social icons under the avatar
  socialIcons:
    - name: "facebook"
      url: "https://facebook.com/your.username"
    - name: "x"
      url: "https://x.com/your_handle"
    - name: "telegram"
      url: "https://t.me/your_username"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/your-id/"
    - name: "github"
      url: "https://github.com/your-handle"
    - name: "orcid"
      url: "https://orcid.org/0000-0000-0000-0000"
    - name: "researchgate"
      url: "https://www.researchgate.net/profile/Your-Name"
    - name: "googlescholar"
      url: "https://scholar.google.com/citations?user=YOUR_GOOGLE_SCHOLAR_ID"
    - name: "upwork"                          # custom icon handled by partial override
      url: "https://www.upwork.com/freelancers/~your-upwork-id"

languages:
  en:
    weight: 1
    languageName: "English"
    languageCode: "en-US"
    contentDir: "content/en"
    title: "Ahmed Elaraby"
    menus:
      main:
        - name: "Home"
          pageRef: "/"
          weight: 10
        - name: "Blog"              # language-aware internal link
          pageRef: "/blog"
          weight: 20
        # (About removed from top menu)
        - identifier: "rss"
          name: ""                  # icon only
          url: "/en/blog/index.xml" # English blog feed
          weight: 40
          pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg><span class="sr-only">RSS</span>'
    params:
      profileMode:
        title: "Ahmed Elaraby"
        subtitle: "Physician • Researcher • Writer"
        imageUrl: "images/profile.jpg"   # put image at /static/images/profile.jpg
        imageTitle: "Ahmed"
        buttons:
          - name: "About Me"             # single center button on home
            url: "/en/about/"

  ar:
    weight: 2
    languageName: "العربية"
    languageCode: "ar-EG"
    languageDirection: "rtl"
    contentDir: "content/ar"
    title: "أحمد العربي"
    menus:
      main:
        - name: "الرئيسية"
          pageRef: "/"
          weight: 10
        - name: "المدونة"
          pageRef: "/blog"
          weight: 20
        # (About removed from top menu)
        - identifier: "rss"
          name: ""                  # icon only
          url: "/ar/blog/index.xml" # Arabic blog feed
          weight: 40
          pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg><span class="sr-only">الخلاصة</span>'
    params:
      profileMode:
        title: "أحمد العربي"
        subtitle: "طبيب • باحث • كاتب"
        imageUrl: "images/profile.jpg"
        imageTitle: "Ahmed"
        buttons:
          - name: "نبذة عني"
            url: "/ar/about/"
