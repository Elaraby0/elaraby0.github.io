baseURL: "https://elaraby.me/"
title: "Ahmed Elaraby"
theme: "PaperMod"
pagerSize: 10
enableRobotsTXT: true

# Multilingual
defaultContentLanguage: en
defaultContentLanguageInSubdir: true  # site served at /en/ and /ar/

# Build outputs (section RSS enabled)
outputs:
  home:    [HTML, RSS]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML]

# RSS service (optional limit)
services:
  rss:
    limit: 50
  googleAnalytics:
    id: "G-84X3SM99NY"
# Taxonomies (optional)
taxonomies:
  category: categories
  tag: tags
  series: series

# Pretty permalinks for blog posts
permalinks:
  blog: "/blog/:slug/"

# Allow HTML inside Markdown (for CV button etc.)
markup:
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  displayFullLangName: true
  comments: false           # let PaperMod render the partial below
  cusdis:
    appid: "30ba217f-9f26-4a3d-8c6a-6539916658d3"
  giscus:
    repo: "Elaraby0/elaraby0.github.io"   # repo that has Discussions enabled
    repoID: "R_kgDOMqsTIg"
    category: "Blog Comments"               # or the name you picked
    categoryID: "DIC_kwDOMqsTIs4CuOe5"
    mapping: "pathname"               # good default
    reactionsEnabled: "1"
    inputPosition: "bottom"
    lang: "auto"
  cover:
    responsiveImages: false
  tagsLayout: "buckets"
  # Profile Mode enabled globally; per-language titles/buttons below
  profileMode:
    enabled: true
  og_fallback:
    method: "cloudinary"
    cloudinary:
      cloud_name: "doggsnovo"   # from your Cloudinary dashboard
      bg_public_id: "og/background"   # the background you just uploaded
      logo_public_id: "og/logo"       # optional; remove this line if you skipped the logo
      font: "Montserrat"              # safe Google font for text overlay
  # FAVICONS (absolute paths + cache-busting)
  assets:
    favicon: "/favicon.ico?v=3"
    favicon16x16: "/favicon-16x16.png?v=3"
    favicon32x32: "/favicon-32x32.png?v=3"
    apple_touch_icon: "/apple-touch-icon.png?v=3"
    customCSS: ["css/extended/custom.css"]
    customJS: ["js/custom.js"]

  # Social icons under the avatar
  socialIcons:
    - name: "facebook"
      url: "https://facebook.com/ElarabyMD"
    - name: "x"
      url: "https://x.com/ElarabyMD"
    - name: "telegram"
      url: "https://t.me/ElarabyBlog"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/elarabymd/"
    - name: "github"
      url: "https://github.com/Elaraby0"
    - name: "orcid"
      url: "https://orcid.org/0000-0001-6963-7307"
    - name: "researchgate"
      url: "https://www.researchgate.net/profile/Ahmed-Elaraby-11"
    - name: "googlescholar"
      url: "https://scholar.google.com/citations?user=dFUfLfAAAAAJ&hl=en"
    - name: "upwork"                          # custom icon handled by partial override
      url: "https://upwork.com/freelancers/elarabymd"

languages:
  en:
    weight: 1
    languageName: "English"
    languageCode: "en-US"
    contentDir: "content/en"
    title: "Ahmed Elaraby"
    menus:
      main:
        - name: "Home"
          pageRef: "/"
          weight: 10
        - name: "Blog"              # language-aware internal link
          pageRef: "/blog"
          weight: 20
        # (About removed from top menu)
        - identifier: "rss"
          name: ""                  # icon only
          url: "/en/blog/index.xml" # English blog feed
          weight: 40
          pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg><span class="sr-only"></span>'
        
        - name: "Contact" 
          pageRef: "/contact"
          weight: 30
        
        - identifier: tags
          name: "Tags"
          pageRef: "/tags"
          weight: 22
    params:
      profileMode:
        title: "Ahmed Elaraby"
        subtitle: "Physician • Researcher • Writer"
        imageUrl: "images/profile.webp"   # put image at /static/images/profile.webp
        imageTitle: "Ahmed"
        buttons:
          - name: "About Me"             # single center button on home
            url: "/en/about/"

  ar:
    weight: 2
    languageName: "العربية"
    languageCode: "ar-EG"
    languageDirection: "rtl"
    contentDir: "content/ar"
    title: "أحمد العربي"
    menus:
      main:
        - name: "الرئيسية"
          pageRef: "/"
          weight: 10
        - name: "المدونة"
          pageRef: "/blog"
          weight: 20
        # (About removed from top menu)
        - identifier: "rss"
          name: ""                  # icon only
          url: "/ar/blog/index.xml" # Arabic blog feed
          weight: 40
          pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg><span class="sr-only"></span>'
        - name: "تواصل"   
          pageRef: "/contact"
          weight: 30
        - identifier: tags
          name: "الوسوم"
          pageRef: "/tags"
          weight: 22
    params:
      profileMode:
        title: "أحمد العربي"
        subtitle: "طبيب • باحث • كاتب"
        imageUrl: "images/profile.webp"
        imageTitle: "أحمد"
        buttons:
          - name: "نبذة عني"
            url: "/ar/about/"

